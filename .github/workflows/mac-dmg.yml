# Bnnr Studio als ondertekende en genotariseerde Mac-app (DMG), gebouwd op een Mac van GitHub.
#
# Starten: GitHub → Actions → "Mac-app (DMG)" → Run workflow, of een tag pushen (v0.2.0).
# Resultaat: twee DMG's (Apple silicon en Intel) onder "Artifacts" van de run, en bij een tag ook als release.
#
# Nodig als repository-secrets (Settings → Secrets and variables → Actions):
#   MAC_CERT_P12_BASE64     Developer ID Application-certificaat (.p12), base64 (zie README)
#   MAC_CERT_PASSWORD       wachtwoord van dat .p12-bestand
#   APPLE_ID                je Apple ID (e-mailadres van het developer-account)
#   APPLE_APP_SPECIFIC_PASSWORD  app-specifiek wachtwoord (appleid.apple.com → Inloggen en beveiliging)
#   APPLE_TEAM_ID           Team ID (developer.apple.com → Membership, 10 tekens)
# Zonder deze secrets wordt de DMG gewoon gebouwd, maar niet ondertekend (macOS waarschuwt dan bij openen).
name: Mac-app (DMG)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Afhankelijkheden
        run: npm ci

      - name: Controles (types en tests)
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Ondertekenen voorbereiden
        id: sign
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Geen certificaat ingesteld: de DMG wordt NIET ondertekend of genotariseerd."
          fi

      - name: DMG bouwen (ondertekend en genotariseerd)
        if: steps.sign.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac -- --publish never

      - name: DMG bouwen (niet ondertekend)
        if: steps.sign.outputs.signed != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --publish never

      - name: Handtekening en notarisatie controleren
        if: steps.sign.outputs.signed == 'true'
        run: |
          for app in dist/mac*/"Bnnr Studio.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
            xcrun stapler validate "$app"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Bnnr-Studio-mac
          path: dist/*.dmg
          if-no-files-found: error

      - name: Release (bij een tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Bnnr Studio $GITHUB_REF_NAME" --generate-notes
